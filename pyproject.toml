[project]
name = "bacnet-network-calculator"
version = "0.1.0"
description = "An interactive subnet calculator and primer explaining BACnet/IP, BACnet/Ethernet, broadcast address intersections, and BBMD routing."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pyrefly>=1.0.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
