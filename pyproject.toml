[project]
name = "bacnet-studio"
version = "0.1.0"
description = "BACnet Studio by ACE IoT: plan, diagram, validate, and troubleshoot BACnet networks."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pyrefly>=1.0.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
